<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Maze Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #0f141d;
      color: #ffffff;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      padding: 14px;
    }

    #sharedCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
    }

    .header {
      margin-bottom: 12px;
    }

    .header h1 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    .header p {
      margin: 0;
      color: #b9c4d3;
      font-size: 13px;
    }

    .maze-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
    }

    .maze-view {
      position: relative;
      min-width: 0;
      width: 100%;
      min-height: 112px;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: transparent;
    }

    @media (max-width: 1700px) {
      .maze-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
    }

    @media (max-width: 1300px) {
      .maze-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .maze-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      .maze-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 420px) {
      .maze-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

    }
  }
  </script>
</head>

      const cellLines = lines.filter((line) => /^\s*\d+\s*\|/.test(line));

          `${borderLines.length} and ${cellLines.length}.`

        const firstPlus = line.indexOf("+");

        ...trimmedCells.map((line) => countChar(line, "|") - 1)

      const boundaryRows = borderLines.length;

            col * 4 + 4

          exit = { col: cols + 0.15, row };
        }

      );

      renderer.setClearColor(0x111823, 1);
      renderer.clear(true, true, true);

      updateOrthographicCamera(
        viewer.camera,
        rect.width / rect.height,
        viewer.baseHalfHeight
      );

      // Rotate around the maze group's local origin, which is its centre.
      // Elapsed-time rotation keeps motion continuous after scrolling off-screen.
      viewer.mazeGroup.rotation.y =
        viewer.initialRotation +
        elapsed * viewer.rotationSpeed;

      if (viewer.startOrb) {
        viewer.startOrb.position.y =
          0.29 +
          Math.sin(
            elapsed * 2.4 +
            viewer.index * 0.2
          ) * 0.05;
      }

      if (viewer.exitOrb) {
        viewer.exitOrb.position.y =
          0.29 +
          Math.sin(
            elapsed * 2.4 +
            viewer.index * 0.2 +
            Math.PI
          ) * 0.05;
      }

      renderer.render(
        viewer.scene,
        viewer.camera
      );
    }

    const clock = new THREE.Clock();

    function animate() {
      resizeRendererToDisplaySize();

      renderer.setScissorTest(false);
      renderer.setClearColor(0x000000, 0);
      renderer.clear(true, true, true);
      renderer.setScissorTest(true);

      const elapsed = clock.getElapsedTime();

      viewers.forEach((viewer) => {
        renderViewer(viewer, elapsed);
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
