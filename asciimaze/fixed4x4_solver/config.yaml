# Self-contained configuration for the fixed 4x4 maze-solving phase.
# Shared model scripts consume this file via --config; no existing phase
# configuration or code needs to be changed.
experiment_dir: asciimaze/fixed4x4_solver/finetune

train:
  gpu: 3
  model_name: unsloth/gemma-4-E2B-it
  max_seq_length: 1024
  load_in_4bit: false
  full_finetuning: false
  finetune_vision_layers: false
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_bias: none
  random_state: 3407
  chat_template: gemma-4
  train_file: asciimaze/fixed4x4_solver/data/train.jsonl
  val_file: asciimaze/fixed4x4_solver/data/val.jsonl
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  warmup_steps: 5
  num_train_epochs: 2
  max_steps: null
  learning_rate: 0.0002
  logging_steps: 1
  optim: adamw_8bit
  weight_decay: 0.001
  lr_scheduler_type: linear
  seed: 3407
  report_to: none
  output_dir: ${experiment_dir}/lora

export:
  gpu: 3
  lora_path: ${experiment_dir}/lora
  max_seq_length: 1024
  load_in_4bit: false
  save_merged: true
  merged_dir: ${experiment_dir}/merged
  push_merged: false
  hub_repo: HF_ACCOUNT/gemma_4_finetune_fixed4x4_solver
  hf_token: YOUR_HF_TOKEN

gguf:
  gpu: 3
  lora_path: ${experiment_dir}/lora
  max_seq_length: 1024
  load_in_4bit: false
  save_gguf: true
  gguf_dir: ${experiment_dir}/gguf
  quantization_method: F16
  push_gguf: false
  hub_repo: HF_ACCOUNT/gemma_4_finetune_fixed4x4_solver
  hf_token: YOUR_HF_TOKEN
