<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Maze Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% -15%, #1b2533 0%, #0b0f15 45%, #050608 100%);
      color: #ffffff;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      padding: 20px 14px 40px;
    }

    .page {
      max-width: 1780px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .header p {
      margin: 0 auto;
      max-width: 720px;
      color: #b9c4d3;
      font-size: 14px;
      line-height: 1.5;
    }

    .header code {
      background: #161d27;
      border: 1px solid #2b384b;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 13px;
    }

    .header p.header-links {
      margin-top: 10px;
    }

    .header-links a {
      color: #4d8dff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .header-links a:hover {
      text-decoration: underline;
    }

    .phase-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 24px 0 20px;
    }

    .phase-tab {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #b9c4d3;
      background: #161d27;
      border: 1px solid #2b384b;
      border-radius: 999px;
      padding: 8px 18px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .phase-tab:hover {
      border-color: #4d8dff;
      color: #ffffff;
    }

    .phase-tab.active {
      background: #4d8dff;
      border-color: #4d8dff;
      color: #0f141d;
    }

    .carousel {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .carousel-row {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-width: 0;
    }

    .slot {
      position: relative;
      min-width: 0;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 30%, #141b24 0%, #080a0e 68%, #040506 100%);
    }

    .slot canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .slot-center {
      flex: 1 1 650px;
      min-width: 320px;
      max-width: 950px;
      box-shadow:
        0 0 0 1px #303947,
        0 0 34px rgba(255, 91, 0, 0.08),
        0 22px 52px rgba(0, 0, 0, 0.62);
    }

    .slot-center canvas {
      cursor: grab;
    }

    .slot-center canvas:active {
      cursor: grabbing;
    }

    .slot-side {
      flex: 0 0 150px;
      opacity: 0.55;
      filter: brightness(0.75) saturate(0.85);
      transform: scale(0.92);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s, filter 0.15s;
    }

    .slot-side:hover {
      opacity: 0.9;
      transform: scale(0.96);
      filter: brightness(0.9) saturate(1);
    }

    .slot-label {
      position: absolute;
      left: 8px;
      bottom: 8px;
      font-size: 11px;
      color: #b9c4d3;
      background: rgba(15, 20, 29, 0.7);
      border-radius: 4px;
      padding: 2px 6px;
      pointer-events: none;
    }

    @keyframes carousel-pulse {
      from {
        opacity: 0.35;
        transform: scale(0.93);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .carousel-row.pulse .slot-center,
    .carousel-row.pulse .slot-side {
      animation: carousel-pulse 220ms ease-out;
    }

    .nav-arrow {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #161d27;
      border: 1px solid #2b384b;
      color: #ffffff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .nav-arrow:hover {
      background: #223047;
      border-color: #4d8dff;
    }

    .caption {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: #b9c4d3;
    }

    /* Drop the outermost thumbnail pair as the viewport narrows, instead
       of shrinking every thumbnail below its intended size. */
    @media (max-width: 1400px) {
      .slot-side[data-nav="2"],
      .slot-side[data-nav="-2"] {
        display: none;
      }
    }

    @media (max-width: 780px) {
      .slot-side {
        display: none;
      }

      .slot-center {
        flex-basis: 92%;
        max-width: none;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div class="page">
    <header class="header">
      <h1>Gemma-4 (E2B) ASCII-Maze Finetune</h1>
      <p>
        Finetuning <code>unsloth/gemma-4-E2B-it</code> on a local ASCII-maze
        dataset with Unsloth + LoRA, then exporting, converting, and running
        the result. This page is an interactive 3D gallery of the
        fine-tuned model's generated mazes.
      </p>
      <p class="header-links">
        <a
          href="https://github.com/majnas/finetune-gemma4-to-generate-ascii-maze"
          target="_blank"
          rel="noopener"
        ><img src="https://img.shields.io/badge/GitHub-Repo-181717?style=for-the-badge&logo=github" alt="GitHub Repo" /></a>
      </p>
    </header>

    <nav class="phase-tabs" id="phaseTabs">
      <button class="phase-tab" data-phase="fixed4x4">fixed4x4</button>
      <button class="phase-tab" data-phase="varNxN">varNxN</button>
      <button class="phase-tab" data-phase="varNxM">varNxM</button>
      <button class="phase-tab" data-phase="varNxM_rndSE">varNxM_rndSE</button>
    </nav>

    <div class="carousel">
      <button class="nav-arrow" id="navLeft" aria-label="Previous sample">‹</button>

      <div class="carousel-row" id="carouselRow">
        <div class="slot slot-side" data-nav="-2">
          <canvas id="canvasLeft2"></canvas>
          <div class="slot-label" id="labelLeft2"></div>
        </div>
        <div class="slot slot-side" data-nav="-1">
          <canvas id="canvasLeft1"></canvas>
          <div class="slot-label" id="labelLeft1"></div>
        </div>

        <div class="slot slot-center" id="slotCenter">
          <canvas id="canvasCenter"></canvas>
        </div>

        <div class="slot slot-side" data-nav="1">
          <canvas id="canvasRight1"></canvas>
          <div class="slot-label" id="labelRight1"></div>
        </div>
        <div class="slot slot-side" data-nav="2">
          <canvas id="canvasRight2"></canvas>
          <div class="slot-label" id="labelRight2"></div>
        </div>
      </div>

      <button class="nav-arrow" id="navRight" aria-label="Next sample">›</button>
    </div>

    <div class="caption" id="caption">Loading…</div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const CELL = 1.45;
    const WALL_HEIGHT = 1.15;
    const WALL_THICKNESS = 0.32;
    const PATH_HEIGHT = 0.11;

    const CENTER_BLOOM_STRENGTH = 0.85;
    const SIDE_BLOOM_STRENGTH = 0.5;
    const BLOOM_RADIUS = 0.35;
    const BLOOM_THRESHOLD = 1.15;

    // Camera framing padding: multiplies each maze's circumscribed radius
    // so the side previews' auto-rotation never clips a corner out of view,
    // regardless of that sample's row/column count.
    const ORTHO_PADDING = 1.3;
    const MIN_ORTHO_HALF_HEIGHT = 3.2;
    const MIN_SHADOW_EXTENT = 9;

    // Slow automatic in-plane rotation for the idle side previews.
    const AUTO_ROTATE_MIN_DPS = 4.0;
    const AUTO_ROTATE_MAX_DPS = 7.0;

    // Idle previews shown on each side of the interactive center maze.
    const SIDE_COUNT = 2;

    const PHASES = ["fixed4x4", "varNxN", "varNxM", "varNxM_rndSE"];
    const DEFAULT_PHASE = "varNxM_rndSE";

    // Shared geometry and materials keep memory and draw-call overhead low
    // across every viewport and every sample they ever display.
    const horizontalWallGeometry = new THREE.BoxGeometry(
      CELL + WALL_THICKNESS,
      WALL_HEIGHT,
      WALL_THICKNESS
    );

    const verticalWallGeometry = new THREE.BoxGeometry(
      WALL_THICKNESS,
      WALL_HEIGHT,
      CELL + WALL_THICKNESS
    );

    const markerRingGeometry = new THREE.TorusGeometry(0.32, 0.055, 16, 48);
    const markerOrbGeometry = new THREE.SphereGeometry(0.115, 20, 20);

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x7b8088,
      roughness: 0.78,
      metalness: 0.13
    });

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x11161d,
      roughness: 0.94,
      metalness: 0.04
    });

    const floorGridMaterial = new THREE.LineBasicMaterial({
      color: 0x38414d,
      transparent: true,
      opacity: 0.34
    });

    const baseMaterial = new THREE.MeshStandardMaterial({
      color: 0x05070a,
      roughness: 0.98,
      metalness: 0.02
    });

    // The reference style uses the same hot orange treatment for both markers.
    const startMarkerMaterial = new THREE.MeshStandardMaterial({
      color: 0xff7900,
      emissive: 0xff4d00,
      emissiveIntensity: 2.0,
      roughness: 0.28,
      metalness: 0.12,
      toneMapped: false
    });

    const exitMarkerMaterial = startMarkerMaterial;

    const identityMatrix = new THREE.Matrix4();

    function localX(gridX, cols) {
      return (gridX - cols / 2) * CELL;
    }

    function localZ(gridY, rows) {
      return (gridY - rows / 2) * CELL;
    }

    function countChar(str, ch) {
      let count = 0;

      for (const c of str) {
        if (c === ch) {
          count += 1;
        }
      }

      return count;
    }

    function parseMaze(mazeText) {
      const lines = mazeText.split("\n").map((line) => line.replace(/\r$/, ""));

      const borderLines = lines.filter((line) => line.includes("+"));
      const cellLines = lines.filter((line) => /^\s*\d+\s*\|/.test(line));

      if (borderLines.length < 2 || cellLines.length < 1) {
        throw new Error(
          `Expected at least 2 border lines and 1 cell line, received ` +
          `${borderLines.length} and ${cellLines.length}.`
        );
      }

      const trimmedBorders = borderLines.map((line) => {
        const firstPlus = line.indexOf("+");
        return firstPlus >= 0 ? line.slice(firstPlus) : line;
      });

      const trimmedCells = cellLines.map((line) => {
        const firstPipe = line.indexOf("|");
        return firstPipe >= 0 ? line.slice(firstPipe) : line;
      });

      // Column count is derived per maze (rather than assumed) so mazes of
      // any width parse correctly; take the widest line to tolerate a
      // ragged/malformed row without truncating the rest of the maze.
      const cols = Math.max(
        1,
        ...trimmedBorders.map((line) => countChar(line, "+") - 1),
        ...trimmedCells.map((line) => countChar(line, "|") - 1)
      );

      const rows = cellLines.length;
      const boundaryRows = borderLines.length;

      const h = Array.from({ length: boundaryRows }, () => Array(cols).fill(0));
      const v = Array.from({ length: rows }, () => Array(cols + 1).fill(0));

      let start = null;
      let exit = null;

      for (let boundary = 0; boundary < boundaryRows; boundary += 1) {
        const mazePart = trimmedBorders[boundary];

        for (let col = 0; col < cols; col += 1) {
          const segment = mazePart.slice(col * 4 + 1, col * 4 + 4);
          h[boundary][col] = segment.includes("-") ? 1 : 0;
        }
      }

      for (let row = 0; row < rows; row += 1) {
        const mazePart = trimmedCells[row];

        for (let boundary = 0; boundary <= cols; boundary += 1) {
          v[row][boundary] = mazePart[boundary * 4] === "|" ? 1 : 0;
        }

        for (let col = 0; col < cols; col += 1) {
          const content = mazePart.slice(col * 4 + 1, col * 4 + 4);

          if (content.includes("S")) {
            start = { col, row };
          }

          if (content.includes("E")) {
            exit = { col, row };
          }
        }

        // Preserve malformed model outputs that place S or E to the right
        // of the maze's own detected column boundary.
        const overflow = mazePart.slice(cols * 4);

        if (!start && overflow.includes("S")) {
          start = { col: cols + 0.15, row };
        }

        if (!exit && overflow.includes("E")) {
          exit = { col: cols + 0.15, row };
        }
      }

      return { h, v, start, exit, cols, rows };
    }

    // Breadth-first shortest path from S to E over the same wall grid used
    // for rendering. Returns an ordered list of [col, row] cells, or null
    // if either marker is missing/off-grid (e.g. a malformed sample with
    // an overflow marker) or no path connects them.
    function solveMazePath(parsed) {
      const { cols, rows, h, v, start, exit } = parsed;

      if (!start || !exit) {
        return null;
      }

      const startCol = Math.round(start.col);
      const exitCol = Math.round(exit.col);

      const inBounds = (col, row) =>
        Number.isInteger(col) && col >= 0 && col < cols &&
        row >= 0 && row < rows;

      if (!inBounds(startCol, start.row) || !inBounds(exitCol, exit.row)) {
        return null;
      }

      const visited = Array.from({ length: rows }, () => Array(cols).fill(false));
      const cameFrom = Array.from({ length: rows }, () => Array(cols).fill(null));

      const queue = [[startCol, start.row]];
      visited[start.row][startCol] = true;

      while (queue.length > 0) {
        const [col, row] = queue.shift();

        if (col === exitCol && row === exit.row) {
          break;
        }

        const neighbors = [];

        if (row > 0 && h[row][col] === 0) {
          neighbors.push([col, row - 1]);
        }

        if (row < rows - 1 && h[row + 1][col] === 0) {
          neighbors.push([col, row + 1]);
        }

        if (col > 0 && v[row][col] === 0) {
          neighbors.push([col - 1, row]);
        }

        if (col < cols - 1 && v[row][col + 1] === 0) {
          neighbors.push([col + 1, row]);
        }

        for (const [nCol, nRow] of neighbors) {
          if (!visited[nRow][nCol]) {
            visited[nRow][nCol] = true;
            cameFrom[nRow][nCol] = [col, row];
            queue.push([nCol, nRow]);
          }
        }
      }

      if (!visited[exit.row][exitCol]) {
        return null;
      }

      const path = [];
      let step = [exitCol, exit.row];

      while (step) {
        path.push(step);
        const [col, row] = step;
        step = (col === startCol && row === start.row) ? null : cameFrom[row][col];
      }

      path.reverse();
      return path;
    }

    const PATH_HALO_COLOR = 0xff3500;
    const PATH_BEAM_COLOR = new THREE.Color().setRGB(2.4, 0.42, 0.01);
    const PATH_CORE_COLOR = new THREE.Color().setRGB(4.8, 1.55, 0.22);
    const PATH_PULSE_COLOR = new THREE.Color().setRGB(5.5, 1.65, 0.2);
    const PATH_PULSE_COUNT = 6;
    const PATH_CORNER_RADIUS = 0.34;

    // Rounds each interior waypoint with a short quadratic-Bezier fillet
    // (clamped to a fraction of the shorter adjoining segment so back-to-back
    // turns can never overshoot into a neighboring corner) instead of a
    // sharp right angle, so the beam reads as a continuous flowing route.
    function buildRoundedPathCurve(points, cornerRadius) {
      const curve = new THREE.CurvePath();

      if (points.length < 2) {
        return curve;
      }

      let current = points[0].clone();

      for (let i = 1; i < points.length - 1; i += 1) {
        const previous = points[i - 1];
        const corner = points[i];
        const next = points[i + 1];

        const incoming = corner.clone().sub(previous).normalize();
        const outgoing = next.clone().sub(corner).normalize();

        const maxRadius = Math.min(
          corner.distanceTo(previous),
          corner.distanceTo(next)
        ) * 0.45;

        const radius = Math.min(cornerRadius, maxRadius);

        const beforeCorner = corner.clone().addScaledVector(incoming, -radius);
        const afterCorner = corner.clone().addScaledVector(outgoing, radius);

        curve.add(new THREE.LineCurve3(current, beforeCorner));
        curve.add(new THREE.QuadraticBezierCurve3(beforeCorner, corner, afterCorner));
        current = afterCorner;
      }

      curve.add(new THREE.LineCurve3(current, points[points.length - 1]));
      return curve;
    }

    // Layered halo/beam/core tubes plus small traveling pulses along the
    // route, all self-lit MeshBasicMaterials so the beam reads as glowing
    // rather than a lit/shaded solid.
    function createPathMesh(parsed) {
      const path = solveMazePath(parsed);

      if (!path || path.length < 2) {
        return null;
      }

      const points = path.map(
        ([col, row]) => new THREE.Vector3(
          localX(col + 0.5, parsed.cols),
          PATH_HEIGHT,
          localZ(row + 0.5, parsed.rows)
        )
      );

      const curve = buildRoundedPathCurve(points, PATH_CORNER_RADIUS);
      const tubularSegments = Math.max(path.length * 12, 24);

      const group = new THREE.Group();

      const halo = new THREE.Mesh(
        new THREE.TubeGeometry(curve, tubularSegments, 0.19, 12, false),
        new THREE.MeshBasicMaterial({
          color: PATH_HALO_COLOR,
          transparent: true,
          opacity: 0.11,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          toneMapped: false
        })
      );
      halo.userData.disposableGeometry = true;
      halo.userData.disposableMaterial = true;
      group.add(halo);

      const beam = new THREE.Mesh(
        new THREE.TubeGeometry(curve, tubularSegments, 0.082, 12, false),
        new THREE.MeshBasicMaterial({
          color: PATH_BEAM_COLOR,
          toneMapped: false
        })
      );
      beam.userData.disposableGeometry = true;
      beam.userData.disposableMaterial = true;
      group.add(beam);

      const core = new THREE.Mesh(
        new THREE.TubeGeometry(curve, tubularSegments, 0.029, 10, false),
        new THREE.MeshBasicMaterial({
          color: PATH_CORE_COLOR,
          toneMapped: false
        })
      );
      core.userData.disposableGeometry = true;
      core.userData.disposableMaterial = true;
      group.add(core);

      // Small glowing orbs that flow along the route; they reuse the
      // shared marker-orb geometry (only their per-instance material is
      // disposed, never the shared geometry).
      const pulses = [];

      for (let index = 0; index < PATH_PULSE_COUNT; index += 1) {
        const pulseMesh = new THREE.Mesh(
          markerOrbGeometry,
          new THREE.MeshBasicMaterial({
            color: PATH_PULSE_COLOR,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            toneMapped: false
          })
        );

        // A couple of traveling point lights make the orange pulse visibly
        // wash over nearby floor tiles and wall faces, like the reference.
        if (index < 2) {
          const pulseLight = new THREE.PointLight(0xff5a00, 2.2, CELL * 1.75, 2.0);
          pulseLight.position.y = 0.08;
          pulseMesh.add(pulseLight);
          pulseMesh.userData.pulseLight = pulseLight;
        }

        pulseMesh.userData.disposableMaterial = true;
        group.add(pulseMesh);
        pulses.push({ mesh: pulseMesh, offset: index / PATH_PULSE_COUNT });
      }

      return { group, curve, halo, beam, core, pulses };
    }

    function createLabelTexture(text) {
      const labelCanvas = document.createElement("canvas");
      labelCanvas.width = 256;
      labelCanvas.height = 128;

      const context = labelCanvas.getContext("2d");
      context.clearRect(0, 0, 256, 128);
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.font = "bold 82px Arial";
      context.fillStyle = "#fff3ce";
      context.shadowColor = "#ff5a00";
      context.shadowBlur = 24;
      context.fillText(text, 128, 64);

      const texture = new THREE.CanvasTexture(labelCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const startLabelMaterial = new THREE.SpriteMaterial({
      map: createLabelTexture("S"),
      color: 0xffad42,
      transparent: true,
      depthTest: true,
      blending: THREE.AdditiveBlending,
      toneMapped: false
    });

    const exitLabelMaterial = new THREE.SpriteMaterial({
      map: createLabelTexture("E"),
      color: 0xffad42,
      transparent: true,
      depthTest: true,
      blending: THREE.AdditiveBlending,
      toneMapped: false
    });

    function createMarker(group, marker, type, cols, rows) {
      if (!marker) {
        return null;
      }

      const isStart = type === "start";
      const material = isStart ? startMarkerMaterial : exitMarkerMaterial;
      const labelMaterial = isStart ? startLabelMaterial : exitLabelMaterial;

      const markerGroup = new THREE.Group();

      markerGroup.position.set(
        localX(marker.col + 0.5, cols),
        0,
        localZ(marker.row + 0.5, rows)
      );

      const ring = new THREE.Mesh(markerRingGeometry, material);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.055;
      markerGroup.add(ring);

      const orb = new THREE.Mesh(markerOrbGeometry, material);
      orb.position.y = 0.20;
      markerGroup.add(orb);

      const label = new THREE.Sprite(labelMaterial);
      label.position.y = 0.58;
      label.scale.set(0.84, 0.42, 1);
      markerGroup.add(label);

      const markerLight = new THREE.PointLight(0xff5800, 2.0, CELL * 1.5, 2.0);
      markerLight.position.y = 0.22;
      markerGroup.add(markerLight);

      group.add(markerGroup);
      return orb;
    }

    function createWallInstances(parsed, group) {
      const horizontalPositions = [];
      const verticalPositions = [];

      parsed.h.forEach((row, boundary) => {
        row.forEach((hasWall, col) => {
          if (hasWall) {
            horizontalPositions.push([
              localX(col + 0.5, parsed.cols),
              WALL_HEIGHT / 2,
              localZ(boundary, parsed.rows)
            ]);
          }
        });
      });

      parsed.v.forEach((row, rowIndex) => {
        row.forEach((hasWall, boundary) => {
          if (hasWall) {
            verticalPositions.push([
              localX(boundary, parsed.cols),
              WALL_HEIGHT / 2,
              localZ(rowIndex + 0.5, parsed.rows)
            ]);
          }
        });
      });

      if (horizontalPositions.length > 0) {
        const horizontalWalls = new THREE.InstancedMesh(
          horizontalWallGeometry,
          wallMaterial,
          horizontalPositions.length
        );

        horizontalWalls.castShadow = true;
        horizontalWalls.receiveShadow = true;

        horizontalPositions.forEach((position, index) => {
          identityMatrix.makeTranslation(...position);
          horizontalWalls.setMatrixAt(index, identityMatrix);
        });

        horizontalWalls.instanceMatrix.needsUpdate = true;
        group.add(horizontalWalls);
      }

      if (verticalPositions.length > 0) {
        const verticalWalls = new THREE.InstancedMesh(
          verticalWallGeometry,
          wallMaterial,
          verticalPositions.length
        );

        verticalWalls.castShadow = true;
        verticalWalls.receiveShadow = true;

        verticalPositions.forEach((position, index) => {
          identityMatrix.makeTranslation(...position);
          verticalWalls.setMatrixAt(index, identityMatrix);
        });

        verticalWalls.instanceMatrix.needsUpdate = true;
        group.add(verticalWalls);
      }
    }

    function createFloorGrid(parsed, group) {
      const vertices = [];
      const minX = localX(0, parsed.cols);
      const maxX = localX(parsed.cols, parsed.cols);
      const minZ = localZ(0, parsed.rows);
      const maxZ = localZ(parsed.rows, parsed.rows);
      const gridY = 0.006;

      for (let col = 0; col <= parsed.cols; col += 1) {
        const x = localX(col, parsed.cols);
        vertices.push(x, gridY, minZ, x, gridY, maxZ);
      }

      for (let row = 0; row <= parsed.rows; row += 1) {
        const z = localZ(row, parsed.rows);
        vertices.push(minX, gridY, z, maxX, gridY, z);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(vertices, 3)
      );

      const grid = new THREE.LineSegments(geometry, floorGridMaterial);
      grid.userData.disposableGeometry = true;
      group.add(grid);
    }

    function createMazeObject(parsed) {
      const group = new THREE.Group();

      const mazeWidth = parsed.cols * CELL;
      const mazeDepth = parsed.rows * CELL;

      const baseGeometry = new THREE.BoxGeometry(
        mazeWidth + 0.72,
        0.28,
        mazeDepth + 0.72
      );

      const floorGeometry = new THREE.BoxGeometry(
        mazeWidth + 0.10,
        0.14,
        mazeDepth + 0.10
      );

      const base = new THREE.Mesh(baseGeometry, baseMaterial);
      base.position.y = -0.21;
      base.receiveShadow = true;
      // Unlike the wall/marker/floor materials and instanced-wall geometry,
      // this Mesh's own BoxGeometry is created fresh per call and must be
      // disposed when the maze is discarded.
      base.userData.disposableGeometry = true;
      group.add(base);

      const floor = new THREE.Mesh(floorGeometry, floorMaterial);
      floor.position.y = -0.07;
      floor.receiveShadow = true;
      floor.userData.disposableGeometry = true;
      group.add(floor);
      createFloorGrid(parsed, group);

      createWallInstances(parsed, group);

      const startOrb = createMarker(group, parsed.start, "start", parsed.cols, parsed.rows);
      const exitOrb = createMarker(group, parsed.exit, "exit", parsed.cols, parsed.rows);

      // Only added when a path actually connects S to E; a malformed
      // sample with no solution simply gets no beam at all.
      const path = createPathMesh(parsed);

      if (path) {
        group.add(path.group);
      }

      return {
        group,
        startOrb,
        exitOrb,
        path,
        mazeWidth,
        mazeDepth
      };
    }

    function disposeMazeGroup(group) {
      group.traverse((object) => {
        if (object.isInstancedMesh) {
          // Disposes only this InstancedMesh's own instance buffer, not the
          // shared BufferGeometry it references.
          object.dispose();
          return;
        }

        if (!object.userData) {
          return;
        }

        if (object.userData.disposableGeometry && object.geometry) {
          object.geometry.dispose();
        }

        // Separate from disposableGeometry: some meshes (e.g. the path
        // pulses) reuse a shared geometry but still own a unique
        // per-instance material that must be disposed here.
        if (object.userData.disposableMaterial && object.material) {
          object.material.dispose();
        }
      });
    }

    function deterministicFraction(seed) {
      const value = Math.sin(seed * 12.9898) * 43758.5453;
      return value - Math.floor(value);
    }

    function deterministicAngle(sampleNumber) {
      // Stable pseudo-random starting angle in the range [-45, 45].
      return -45 + deterministicFraction(sampleNumber) * 90;
    }

    function deterministicRotationSpeed(sampleNumber) {
      const speedDps =
        AUTO_ROTATE_MIN_DPS +
        deterministicFraction(sampleNumber + 1000) *
          (AUTO_ROTATE_MAX_DPS - AUTO_ROTATE_MIN_DPS);

      // Alternate clockwise and anticlockwise rotation.
      const direction = sampleNumber % 2 === 0 ? -1 : 1;

      return THREE.MathUtils.degToRad(speedDps * direction);
    }

    function updateOrthographicCamera(camera, aspect, baseHalfHeight) {
      const halfHeight = aspect < 1
        ? baseHalfHeight / Math.max(aspect, 0.01)
        : baseHalfHeight;

      const halfWidth = halfHeight * Math.max(aspect, 0.01);

      camera.left = -halfWidth;
      camera.right = halfWidth;
      camera.top = halfHeight;
      camera.bottom = -halfHeight;
      camera.updateProjectionMatrix();
    }

    function resizeRendererToDisplaySize(renderer) {
      const canvas = renderer.domElement;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const pixelRatio = renderer.getPixelRatio();

      const expectedWidth = Math.floor(width * pixelRatio);
      const expectedHeight = Math.floor(height * pixelRatio);

      if (canvas.width !== expectedWidth || canvas.height !== expectedHeight) {
        renderer.setSize(width, height, false);
        return true;
      }

      return false;
    }

    function createRenderer(canvas) {
      const renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        powerPreference: "high-performance"
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.95;

      return renderer;
    }

    function createLighting(scene) {
      scene.background = new THREE.Color(0x07090d);
      scene.add(new THREE.HemisphereLight(0xb9c9df, 0x08090b, 1.25));

      const keyLight = new THREE.DirectionalLight(0xf1f5ff, 2.65);
      keyLight.position.set(8, 13, 9);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(1024, 1024);
      scene.add(keyLight);

      const warmRim = new THREE.DirectionalLight(0xff8a4c, 0.52);
      warmRim.position.set(-7, 4, -8);
      scene.add(warmRim);

      return keyLight;
    }

    function createComposer(renderer, scene, camera, bloomStrength) {
      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(renderer.getPixelRatio());
      composer.addPass(new RenderPass(scene, camera));

      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(1, 1),
        bloomStrength,
        BLOOM_RADIUS,
        BLOOM_THRESHOLD
      );
      composer.addPass(bloomPass);
      composer.addPass(new OutputPass());

      return { composer, bloomPass };
    }

    function createSideViewport(canvas) {
      const renderer = createRenderer(canvas);
      const scene = new THREE.Scene();
      const keyLight = createLighting(scene);

      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
      camera.position.set(0, 20, 0.001);
      camera.up.set(0, 0, -1);
      camera.lookAt(0, 0, 0);

      const { composer, bloomPass } = createComposer(
        renderer,
        scene,
        camera,
        SIDE_BLOOM_STRENGTH
      );

      return {
        renderer,
        composer,
        bloomPass,
        scene,
        camera,
        keyLight,
        group: null,
        startOrb: null,
        exitOrb: null,
        path: null,
        baseHalfHeight: MIN_ORTHO_HALF_HEIGHT,
        initialRotation: 0,
        rotationSpeed: 0
      };
    }

    function createCenterViewport(canvas) {
      const renderer = createRenderer(canvas);
      const scene = new THREE.Scene();
      const keyLight = createLighting(scene);

      const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.85;
      controls.zoomSpeed = 0.9;
      controls.panSpeed = 0.7;
      controls.minPolarAngle = THREE.MathUtils.degToRad(12);
      controls.maxPolarAngle = THREE.MathUtils.degToRad(85);
      // autoRotate/autoRotateSpeed are set per-sample in loadCenterViewport.

      const { composer, bloomPass } = createComposer(
        renderer,
        scene,
        camera,
        CENTER_BLOOM_STRENGTH
      );

      return {
        renderer,
        composer,
        bloomPass,
        scene,
        camera,
        controls,
        keyLight,
        group: null,
        startOrb: null,
        exitOrb: null,
        path: null
      };
    }

    function buildMazeIntoViewport(viewport, sample) {
      const parsed = parseMaze(sample.maze);
      const maze = createMazeObject(parsed);

      const boundingRadius = Math.sqrt(
        (maze.mazeWidth / 2) ** 2 + (maze.mazeDepth / 2) ** 2
      );

      viewport.scene.add(maze.group);
      viewport.group = maze.group;
      viewport.startOrb = maze.startOrb;
      viewport.exitOrb = maze.exitOrb;
      viewport.path = maze.path;

      const shadowExtent = Math.max(boundingRadius * 1.2, MIN_SHADOW_EXTENT);
      viewport.keyLight.shadow.camera.left = -shadowExtent;
      viewport.keyLight.shadow.camera.right = shadowExtent;
      viewport.keyLight.shadow.camera.top = shadowExtent;
      viewport.keyLight.shadow.camera.bottom = -shadowExtent;
      viewport.keyLight.shadow.camera.updateProjectionMatrix();

      return boundingRadius;
    }

    function clearViewport(viewport) {
      if (viewport.group) {
        viewport.scene.remove(viewport.group);
        disposeMazeGroup(viewport.group);
        viewport.group = null;
        viewport.path = null;
      }
    }

    function loadSideViewport(viewport, sample) {
      clearViewport(viewport);

      const boundingRadius = buildMazeIntoViewport(viewport, sample);

      viewport.baseHalfHeight = Math.max(
        boundingRadius * ORTHO_PADDING,
        MIN_ORTHO_HALF_HEIGHT
      );

      viewport.initialRotation = THREE.MathUtils.degToRad(
        deterministicAngle(sample.number)
      );
      viewport.rotationSpeed = deterministicRotationSpeed(sample.number);
      viewport.group.rotation.y = viewport.initialRotation;
    }

    function loadCenterViewport(sample) {
      clearViewport(centerViewport);

      const boundingRadius = buildMazeIntoViewport(centerViewport, sample);

      const azimuth = THREE.MathUtils.degToRad(35);
      const polar = THREE.MathUtils.degToRad(45);
      const distance = boundingRadius * 2.4;

      centerViewport.camera.position.setFromSphericalCoords(
        distance,
        polar,
        azimuth
      );

      centerViewport.controls.target.set(0, 0, 0);
      centerViewport.controls.minDistance = boundingRadius * 1.1;
      centerViewport.controls.maxDistance = boundingRadius * 4.5;

      // Spin by default, same per-sample speed/direction as the idle side
      // previews; OrbitControls automatically pauses this while the user
      // is dragging and resumes it once they let go.
      const orbitDegreesPerSecond = THREE.MathUtils.radToDeg(
        deterministicRotationSpeed(sample.number)
      );
      centerViewport.controls.autoRotate = true;
      centerViewport.controls.autoRotateSpeed = orbitDegreesPerSecond / 6;

      centerViewport.controls.update();
    }

    const canvasCenter = document.getElementById("canvasCenter");
    const caption = document.getElementById("caption");
    const carouselRow = document.getElementById("carouselRow");
    const navLeft = document.getElementById("navLeft");
    const navRight = document.getElementById("navRight");

    // sideSlots[i] (i = 0..SIDE_COUNT-1) holds the viewport/label for the
    // preview offset (i + 1) samples from the center, on each side.
    function createSideSlots(side) {
      return Array.from({ length: SIDE_COUNT }, (_, i) => {
        const offset = i + 1;

        return {
          viewport: createSideViewport(
            document.getElementById(`canvas${side}${offset}`)
          ),
          label: document.getElementById(`label${side}${offset}`)
        };
      });
    }

    const leftSlots = createSideSlots("Left");
    const rightSlots = createSideSlots("Right");
    const centerViewport = createCenterViewport(canvasCenter);

    document.querySelectorAll(".slot-side[data-nav]").forEach((element) => {
      const offset = Number(element.dataset.nav);
      element.addEventListener("click", () => goTo(offset));
    });

    const DEFAULT_SAMPLE_NUMBER = 10;

    const samplesCache = {};
    let currentPhase = null;
    let centerIndex = 0;

    function defaultIndexFor(samples) {
      const index = samples.findIndex(
        (sample) => sample.number === DEFAULT_SAMPLE_NUMBER
      );

      return index >= 0 ? index : 0;
    }

    function pulseCarousel() {
      carouselRow.classList.remove("pulse");
      // Force a reflow so re-adding the class restarts the CSS animation.
      void carouselRow.offsetWidth;
      carouselRow.classList.add("pulse");
    }

    function rebuildCarousel() {
      const samples = samplesCache[currentPhase];
      const total = samples.length;

      leftSlots.forEach((slot, i) => {
        const offset = i + 1;
        const sample = samples[(centerIndex - offset + total) % total];

        loadSideViewport(slot.viewport, sample);
        slot.label.textContent = `#${sample.number}`;
      });

      rightSlots.forEach((slot, i) => {
        const offset = i + 1;
        const sample = samples[(centerIndex + offset) % total];

        loadSideViewport(slot.viewport, sample);
        slot.label.textContent = `#${sample.number}`;
      });

      const centerSample = samples[centerIndex];
      loadCenterViewport(centerSample);

      caption.textContent =
        `${currentPhase} · sample ${centerSample.number} / ${centerSample.total}`;

      pulseCarousel();
    }

    function goTo(offset) {
      if (!currentPhase) {
        return;
      }

      const total = samplesCache[currentPhase].length;
      centerIndex = (centerIndex + offset + total) % total;
      rebuildCarousel();
    }

    async function loadPhase(phase) {
      document.querySelectorAll(".phase-tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.phase === phase);
      });

      if (!samplesCache[phase]) {
        caption.textContent = `Loading ${phase}…`;

        const response = await fetch(`data/${phase}.json`);

        if (!response.ok) {
          throw new Error(`Failed to fetch data/${phase}.json: ${response.status}`);
        }

        const data = await response.json();

        if (data.phase !== phase) {
          console.warn(`Expected phase "${phase}", received "${data.phase}"`);
        }

        samplesCache[phase] = [...data.samples].sort((a, b) => a.number - b.number);
      }

      currentPhase = phase;
      centerIndex = defaultIndexFor(samplesCache[phase]);
      rebuildCarousel();
    }

    document.querySelectorAll(".phase-tab").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.phase === currentPhase) {
          return;
        }

        loadPhase(button.dataset.phase).catch((error) => {
          console.error(error);
          caption.textContent = `Failed to load ${button.dataset.phase}`;
        });
      });
    });

    navLeft.addEventListener("click", () => goTo(-1));
    navRight.addEventListener("click", () => goTo(1));

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        goTo(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        goTo(1);
      }
    });

    function updatePathAnimation(viewport, elapsed) {
      const path = viewport.path;

      if (!path) {
        return;
      }

      // Combined slow and fast oscillations read as a controlled electric
      // flicker rather than a single steady pulse.
      const flicker =
        0.88 +
        Math.sin(elapsed * 8.0) * 0.065 +
        Math.sin(elapsed * 21.0) * 0.035 +
        Math.sin(elapsed * 47.0) * 0.018;

      path.halo.material.opacity = 0.045 + flicker * 0.075;

      // HDR-like material values give UnrealBloomPass a hot white/orange core
      // while preserving the saturated orange body of the beam.
      path.beam.material.color.setRGB(
        2.15 * flicker,
        0.38 * flicker,
        0.008
      );
      path.core.material.color.setRGB(
        4.3 * flicker,
        1.35 * flicker,
        0.18 * flicker
      );

      path.pulses.forEach(({ mesh, offset }, index) => {
        const t = (elapsed * 0.18 + offset) % 1;
        const point = path.curve.getPointAt(t);
        mesh.position.copy(point);

        const flash = 0.58 + 0.42 * Math.sin(elapsed * 16 + index * 1.75);
        mesh.scale.setScalar(0.48 + flash * 0.42);
        mesh.material.opacity = 0.48 + flash * 0.32;

        if (mesh.userData.pulseLight) {
          mesh.userData.pulseLight.intensity = 1.2 + flash * 2.2;
        }
      });
    }

    function updateSideViewport(viewport, elapsed) {
      if (!viewport.group) {
        return;
      }

      const width = viewport.renderer.domElement.clientWidth;
      const height = viewport.renderer.domElement.clientHeight;

      if (width === 0 || height === 0) {
        return;
      }

      if (resizeRendererToDisplaySize(viewport.renderer)) {
        viewport.composer.setSize(width, height);
      }
      updateOrthographicCamera(viewport.camera, width / height, viewport.baseHalfHeight);

      viewport.group.rotation.y = viewport.initialRotation + elapsed * viewport.rotationSpeed;

      if (viewport.startOrb) {
        viewport.startOrb.position.y = 0.20 + Math.sin(elapsed * 2.4) * 0.035;
      }

      if (viewport.exitOrb) {
        viewport.exitOrb.position.y = 0.20 + Math.sin(elapsed * 2.4 + Math.PI) * 0.035;
      }

      updatePathAnimation(viewport, elapsed);

      viewport.composer.render();
    }

    function updateCenterViewport(elapsed, deltaSeconds) {
      if (!centerViewport.group) {
        return;
      }

      const width = centerViewport.renderer.domElement.clientWidth;
      const height = centerViewport.renderer.domElement.clientHeight;

      if (width === 0 || height === 0) {
        return;
      }

      if (resizeRendererToDisplaySize(centerViewport.renderer)) {
        centerViewport.composer.setSize(width, height);
      }

      const aspect = width / height;

      if (centerViewport.camera.aspect !== aspect) {
        centerViewport.camera.aspect = aspect;
        centerViewport.camera.updateProjectionMatrix();
      }

      if (centerViewport.startOrb) {
        centerViewport.startOrb.position.y = 0.20 + Math.sin(elapsed * 2.4) * 0.035;
      }

      if (centerViewport.exitOrb) {
        centerViewport.exitOrb.position.y =
          0.20 + Math.sin(elapsed * 2.4 + Math.PI) * 0.035;
      }

      updatePathAnimation(centerViewport, elapsed);

      // Pass real elapsed time explicitly: OrbitControls.update()'s no-arg
      // fallback assumes a fixed 60 calls/sec and drifts if the actual
      // frame rate differs (e.g. a throttled/background tab), which would
      // make autoRotate stall relative to wall-clock time.
      centerViewport.controls.update(deltaSeconds);
      centerViewport.composer.render();
    }

    const clock = new THREE.Clock();
    let elapsedSeconds = 0;

    function animate() {
      const deltaSeconds = clock.getDelta();
      elapsedSeconds += deltaSeconds;

      leftSlots.forEach((slot) => updateSideViewport(slot.viewport, elapsedSeconds));
      rightSlots.forEach((slot) => updateSideViewport(slot.viewport, elapsedSeconds));
      updateCenterViewport(elapsedSeconds, deltaSeconds);

      requestAnimationFrame(animate);
    }

    loadPhase(DEFAULT_PHASE).catch((error) => {
      console.error(error);
      caption.textContent = `Failed to load ${DEFAULT_PHASE}`;
    });

    animate();
  </script>
</body>
</html>
