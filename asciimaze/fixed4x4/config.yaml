# Shared config for gemma4_train.py / gemma4_export.py / gemma4_gguf.py.
#
# experiment_dir is the one physical folder the pipeline shares - train
# writes LoRA adapters there, export/gguf both read that same LoRA and
# write their own outputs alongside it. Any path value containing
# "${experiment_dir}" has it substituted for the value below before the
# script sees it - change experiment_dir once and every derived path moves
# with it.
experiment_dir: asciimaze/fixed4x4/finetune

# Each script reads ONLY its own top-level section below (train / export /
# gguf) and ignores the rest - sections are fully independent, so e.g.
# export: and gguf: each repeat their own gpu / lora_path / load_in_4bit
# rather than sharing one. All argparse flags now default from here (no
# literal defaults left in the scripts); a flag also passed on the command
# line overrides its config value for that run.
#
# Usage (each script auto-loads this file via --config's own default):
#   python asciimaze/gemma4_train.py  --gpu 3
#   python asciimaze/gemma4_export.py --gpu 3
#   python asciimaze/gemma4_gguf.py   --gpu 3
# Pass --config <other.yaml> to point a script at a different file/experiment
# - that file must define experiment_dir and the section(s) that script
# reads (see below); there's no code-level fallback for a key missing from
# the loaded section.

train:
  gpu: 3
  model_name: unsloth/gemma-4-E2B-it
  max_seq_length: 1024
  load_in_4bit: false
  full_finetuning: false
  finetune_vision_layers: false
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_bias: none
  random_state: 3407
  chat_template: gemma-4
  train_file: asciimaze/fixed4x4/data/train.jsonl
  val_file: asciimaze/fixed4x4/data/val.jsonl
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  warmup_steps: 5
  num_train_epochs: 2
  max_steps: null
  learning_rate: 0.0002
  logging_steps: 1
  optim: adamw_8bit
  weight_decay: 0.001
  lr_scheduler_type: linear
  seed: 3407
  report_to: none
  output_dir: ${experiment_dir}/lora

export:
  gpu: 3
  lora_path: ${experiment_dir}/lora
  max_seq_length: 2048
  load_in_4bit: false
  save_merged: true
  merged_dir: ${experiment_dir}/merged
  push_merged: false
  hub_repo: HF_ACCOUNT/gemma_4_finetune
  hf_token: YOUR_HF_TOKEN

gguf:
  gpu: 3
  lora_path: ${experiment_dir}/lora
  max_seq_length: 2048
  load_in_4bit: false
  save_gguf: true
  gguf_dir: ${experiment_dir}/gguf
  quantization_method: F16
  push_gguf: false
  hub_repo: HF_ACCOUNT/gemma_4_finetune
  hf_token: YOUR_HF_TOKEN
